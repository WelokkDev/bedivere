[project]
name = "bedivere"
version = "0.1.0"
description = "A bar-replay trading engine: one loop for backtest, shadow, and live."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # zoneinfo has no system tz database on Windows; tzdata supplies IANA data.
    "tzdata>=2024.1",
    # Strategy config + spec envelope: frozen models, extra="forbid" everywhere,
    # and validation errors that name the offending path.
    "pydantic>=2.7",
]

[project.optional-dependencies]
# The bar lake (bedivere.data.lake, bedivere.data.vendor). Optional so a clone
# that only replays a CSV can run the test suite and the example with no native
# wheel at all.
lake = [
    "duckdb>=1.5",
    # The Rust DBN decoder alone, NOT the `databento` client package — that one
    # imports a heavy Arrow stack for functionality the lake does not use.
    "databento-dbn>=0.65",
    "numpy>=1.26",
    "pandas>=2.2",
    "requests>=2.32",
]

[project.scripts]
bedivere-backtest = "bedivere.cli.backtest:main"
bedivere-live = "bedivere.cli.live:main"
bedivere-data = "bedivere.cli.data:main"
bedivere-runs = "bedivere.cli.runs:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bedivere"]

# Hatchling's sdist default is "every file git does not ignore", which silently
# collects whatever lands in the repo root — authoring notes, scratch specs, a
# stray data file. An explicit allowlist makes the sdist default-DENY, so the
# published artifact only ever grows when someone edits this list.
[tool.hatch.build.targets.sdist]
include = [
    "/src/bedivere",
    "/tests",
    "/examples",
    "/docs",
    "/conftest.py",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501 long lines: error-message constants read better unwrapped.
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests", "examples"]
# Editors may not auto-search src/; bedivere then resolves through the venv as an untyped library.
extraPaths = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
