[project]
name = "bedivere"
version = "0.1.0"
description = "A trading engine."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # zoneinfo has no system tz database on Windows; tzdata supplies IANA data.
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bedivere"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501 long lines: error-message constants read better unwrapped.
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests", "examples"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
